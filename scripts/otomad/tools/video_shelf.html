<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BB劇場・音MADの動画</title>
<!-- video_shelf.py が scratch/videos/index.html へ書き出すひな形（見た目は scripts/misc/song-shelf.html と同じ）。作品のデータは SHELF に入る -->
<style>
:root {
	--bg: #f6f5f2; --panel: #ffffff; --fg: #1c1b19; --muted: #6d6a64; --line: #e2dfd8; --hover: #efede8; --sel: #e7e4dc;
	--accent: #4a6fa5; --bad: #b0503c; --none: #a8a49c;
	--mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
	:root {
		--bg: #151514; --panel: #1d1c1b; --fg: #ebe9e4; --muted: #9c988f; --line: #33312e; --hover: #24231f; --sel: #2c2a26;
		--accent: #7f9fd0; --bad: #d98a72; --none: #6f6b64;
	}
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.65 system-ui, "Yu Gothic UI", "Hiragino Sans", sans-serif; }
.wrap { display: grid; grid-template-columns: 300px minmax(0, 1fr); min-height: 100vh; }
aside { border-right: 1px solid var(--line); padding: 20px 0; position: sticky; top: 0; height: 100vh; overflow: auto; }
aside h1 { font-size: 15px; margin: 0 16px 12px; font-weight: 600; }
aside h1 span { color: var(--muted); font-weight: 400; margin-left: 6px; }
.item { display: block; width: 100%; text-align: left; border: 0; background: none; color: inherit; font: inherit; padding: 8px 16px; cursor: pointer; }
.item:hover { background: var(--hover); }
.item[aria-current="true"] { background: var(--sel); }
.item .when { font-family: var(--mono); font-size: 12px; color: var(--muted); margin-right: 8px; }
.item .facts { display: block; font-size: 12px; color: var(--muted); }
.missing { margin: 16px; font-size: 12px; color: var(--muted); }
main { padding: 28px 32px 64px; max-width: 980px; min-width: 0; overflow-wrap: anywhere; }
h2 { font-size: 22px; margin: 0; font-weight: 600; }
h3 { font-size: 14px; margin: 28px 0 10px; font-weight: 600; }
.sub { color: var(--muted); margin: 2px 0 14px; }
.facts-row { display: flex; flex-wrap: wrap; gap: 4px 18px; margin: 0 0 14px; }
.facts-row b { font-weight: 600; }
.verdict { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px; border: 1px solid var(--line); }
.verdict.none { color: var(--muted); }
video { width: 100%; display: block; background: #000; border-radius: 4px; aspect-ratio: 16 / 9; }
.strip { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 4px; margin: 6px 0 2px; }
.strip button { border: 0; padding: 0; background: none; cursor: pointer; color: var(--muted); font: 11px var(--mono); text-align: left; }
.strip img { width: 100%; display: block; border-radius: 2px; aspect-ratio: 16 / 9; object-fit: cover; }
.strip button:hover img { outline: 2px solid var(--accent); }
.note { color: var(--muted); font-size: 12px; margin: 6px 0 0; }
.path { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.doc h3:first-child { margin-top: 8px; }
.doc p, .doc ul, .doc ol { margin: 6px 0; }
.doc ul, .doc ol { padding-left: 22px; }
.doc code { font-family: var(--mono); font-size: 12px; background: var(--hover); padding: 0 3px; border-radius: 3px; }
.doc a { color: var(--accent); }
table { border-collapse: collapse; width: 100%; font-size: 13px; margin-top: 8px; }
th, td { text-align: left; padding: 4px 8px 4px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 400; }
tr.seek { cursor: pointer; }
tr.seek:hover { background: var(--hover); }
.empty { color: var(--muted); }
@media (max-width: 760px) {
	.wrap { grid-template-columns: minmax(0, 1fr); }
	aside { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); max-height: 45vh; }
	main { padding: 20px 16px 48px; }
	.strip { grid-template-columns: repeat(4, minmax(0, 1fr)); }
}
</style>
</head>
<body>
<div class="wrap">
	<aside><h1>BB劇場・音MADの動画<span id="count"></span></h1><nav id="list"></nav><p class="missing" id="missing"></p></aside>
	<main id="detail"></main>
</div>
<script>
const SHELF = /*SHELF*/{};
const WORKS = SHELF.works ?? [];
const DOCS = "../../docs/otomad/works/"; // 台帳の中の相対リンクの起点（index.html から見て）
const el = (tag, attrs = {}, ...kids) => {
	const e = document.createElement(tag);
	for (const [k, v] of Object.entries(attrs)) {
		if (k === "class") e.className = v;
		else e.setAttribute(k, v);
	}
	for (const k of kids.flat(Infinity)) if (k != null && k !== false) e.append(k instanceof Node ? k : String(k));
	return e;
};
const mmss = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
const verdictClass = (v) => (v.startsWith("評価なし") ? "none" : "");

// 台帳の Markdown を表示する（見出し・箇条・番号・表・段落、行内は `code`・**太字**・[リンク](…) だけ）
function inline(text) {
	const out = [];
	const re = /`([^`]+)`|\*\*([^*]+)\*\*|\[([^\]]+)\]\(([^)]+)\)/g;
	let last = 0;
	for (const m of text.matchAll(re)) {
		out.push(text.slice(last, m.index));
		if (m[1] != null) out.push(el("code", {}, m[1]));
		else if (m[2] != null) out.push(el("b", {}, m[2]));
		else out.push(el("a", { href: /^[a-z]+:/.test(m[4]) ? m[4] : DOCS + m[4], target: "_blank", rel: "noopener" }, m[3]));
		last = m.index + m[0].length;
	}
	out.push(text.slice(last));
	return out;
}
const cells = (line) => line.trim().replace(/^\||\|$/g, "").split("|").map((c) => c.trim());
function markdown(md, video) {
	const lines = md.split(/\r?\n/);
	const out = [];
	for (let i = 0; i < lines.length; ) {
		const line = lines[i];
		if (/^# /.test(line) || !line.trim()) { i++; continue; } // 題は上に出している
		const h = /^(#{2,4}) (.+)/.exec(line);
		if (h) { out.push(el("h3", {}, inline(h[2]))); i++; continue; }
		if (line.startsWith("|")) {
			const rows = [];
			while (i < lines.length && lines[i].startsWith("|")) rows.push(cells(lines[i++]));
			const [head, , ...body] = rows;
			const bySecond = /秒/.test(head[0]); // 緩急計画の「区間（秒）」は押すとその秒へ
			out.push(el("table", {}, el("thead", {}, el("tr", {}, head.map((c) => el("th", {}, inline(c))))),
				el("tbody", {}, body.map((r) => {
					const t = bySecond ? /^(\d+(?:\.\d+)?)/.exec(r[0]) : null;
					const tr = el("tr", t ? { class: "seek", title: "押すとこの秒へ移る" } : {}, r.map((c) => el("td", {}, inline(c))));
					if (t) tr.addEventListener("click", () => { video.currentTime = Number(t[1]); video.scrollIntoView({ block: "nearest" }); });
					return tr;
				}))));
			continue;
		}
		const list = /^(\s*)(-|\d+\.) /.exec(line);
		if (list) {
			const ordered = list[2] !== "-";
			const items = [];
			while (i < lines.length && /^\s*(-|\d+\.) /.test(lines[i])) items.push(lines[i++].replace(/^\s*(-|\d+\.) /, ""));
			out.push(el(ordered ? "ol" : "ul", {}, items.filter((x) => x.trim()).map((x) => el("li", {}, inline(x)))));
			continue;
		}
		const para = [];
		while (i < lines.length && lines[i].trim() && !/^(#|\||\s*(-|\d+\.) )/.test(lines[i])) para.push(lines[i++]);
		out.push(el("p", {}, inline(para.join(""))));
	}
	return out;
}

function renderList(currentId) {
	document.getElementById("list").replaceChildren(...WORKS.map((w) =>
		el("button", { class: "item", type: "button", "aria-current": String(w.id === currentId), "data-id": w.id },
			el("span", { class: "when" }, w.at.slice(5)), w.id,
			el("span", { style: "font-size:11px;color:var(--muted);margin-left:6px;" }, `[${w.model}]`),
			el("span", { class: "facts" }, [w.kind, w.facts.seconds ? mmss(w.facts.seconds) : null, w.verdict === "評価なし" ? w.verdict : "評価あり"].filter(Boolean).join(" ・ ")))));
	document.getElementById("count").textContent = `${WORKS.length}本`;
	const miss = SHELF.missing ?? [];
	document.getElementById("missing").textContent = miss.length ? `台帳の一覧にあるが動画が手元に無い: ${miss.join("、")}` : "";
}

function renderDetail(w) {
	const f = w.facts;
	const video = el("video", { controls: "", preload: "metadata", src: w.video, poster: w.frames[0]?.src ?? "" });
	const kids = [
		el("h2", {}, w.title),
		el("p", { class: "sub" }, `${w.at}・日本時間（動画を書き出した時刻） ・ 作成モデル: ${w.model}`),
		el("p", { class: "sub" }, `${w.kind} ／ ${w.aim}`),
		el("div", { class: "facts-row" },
			f.seconds ? el("span", {}, el("b", {}, mmss(f.seconds)), `（${f.seconds} 秒）`) : null,
			f.size ? el("span", {}, el("b", {}, f.size)) : null,
			f.fps ? el("span", {}, el("b", {}, f.fps), " fps") : null,
			el("span", { class: `verdict ${verdictClass(w.verdict)}` }, `評価: ${w.verdict}`)),
		video,
		w.frames.length ? el("div", { class: "strip" }, w.frames.map((fr) => {
			const b = el("button", { type: "button", title: "押すとこの秒へ移る" }, el("img", { src: fr.src, alt: "", loading: "lazy" }), mmss(fr.t));
			b.addEventListener("click", () => { video.currentTime = fr.t; });
			return b;
		})) : null,
		el("p", { class: "path" }, w.videoPath),
	];
	kids.push(w.md ? el("div", { class: "doc" }, markdown(w.md, video))
		: el("p", { class: "empty" }, `台帳（docs/otomad/works/${w.id}.md）が手元に無い`));
	document.getElementById("detail").replaceChildren(...kids.filter(Boolean));
}

function show(id) {
	const w = WORKS.find((x) => x.id === id) || WORKS[0]; // 既定は一覧の先頭（いちばん新しい作品）
	if (!w) {
		document.getElementById("detail").replaceChildren(el("p", { class: "empty" }, "動画が手元に無い。作品を書き出してから python -I scripts/otomad/tools/video_shelf.py を流す。"));
		renderList(null);
		return;
	}
	renderList(w.id);
	renderDetail(w);
	if (location.hash.slice(1) !== w.id) history.replaceState(null, "", `#${w.id}`);
}
document.getElementById("list").addEventListener("click", (e) => {
	const b = e.target.closest(".item");
	if (b) show(b.dataset.id);
});
show(decodeURIComponent(location.hash.slice(1)));
</script>
</body>
</html>
