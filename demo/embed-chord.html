<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-M0KNK6K99N"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'G-M0KNK6K99N');
    </script>

    <link rel="icon" href="https://avatars.githubusercontent.com/u/88383494" />
    <title>Chord Player (Embed)</title>
    <style>
        @font-face {
            font-family: 'k8x12';
            src: url('https://db.onlinewebfonts.com/t/777630d46640dc5a928ea833c2fcb875.woff2') format('woff2'),
                url('https://db.onlinewebfonts.com/t/777630d46640dc5a928ea833c2fcb875.woff') format('woff'),
                url('https://db.onlinewebfonts.com/t/777630d46640dc5a928ea833c2fcb875.ttf') format('truetype');
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            background: #000;
            color: #fff1e8;
            font-family: 'k8x12', ui-monospace, monospace;
            font-size: 14px;
            -webkit-font-smoothing: none;
            font-smooth: never;
        }

        #player {
            padding: 6px;
        }

        #boot {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 16px;
            color: #83769c;
            letter-spacing: .1em;
            text-transform: uppercase;
            font-size: 12px;
        }

        #boot .spin {
            color: #29adff;
            animation: blink 1s steps(1) infinite;
        }

        @keyframes blink {
            0%,
            100% {
                opacity: 1
            }

            50% {
                opacity: 0
            }
        }

        #err {
            display: none;
            padding: 16px;
            color: #ff004d;
            font-size: 12px;
            line-height: 1.6;
        }

        #volume-row {
            display: none;
            align-items: center;
            gap: 8px;
            padding: 0 8px 6px;
            font-size: 11px;
            color: #83769c;
        }

        #volume-row input[type="range"] {
            flex: 1;
            accent-color: #29adff;
        }

        #volume-label {
            min-width: 3.2em;
            text-align: right;
            color: #fff1e8;
        }

        .credit {
            display: block;
            text-align: right;
            padding: 2px 8px 6px;
            font-size: 10px;
            letter-spacing: .08em;
            text-transform: uppercase;
        }

        .credit a {
            color: #5f574f;
            text-decoration: none;
        }

        .credit a:hover {
            color: #29adff;
        }
    </style>
</head>

<body>
    <div id="boot"><span class="spin">█</span> LOADING PLAYER…</div>
    <div id="err"></div>
    <div id="player"></div>
    <div id="volume-row">
        <span>🔊</span>
        <input type="range" id="volume-slider" min="0" max="100" value="50" />
        <span id="volume-label">50%</span>
    </div>
    <div class="credit"><a href="https://github.com/onjmin/dtm" target="_blank" rel="noopener">♪ @onjmin/dtm</a></div>

    <script type="module">
        const bootEl = document.getElementById('boot');
        const errEl = document.getElementById('err');
        const playerEl = document.getElementById('player');

        const fail = (msg) => {
            bootEl.style.display = 'none';
            errEl.style.display = 'block';
            errEl.textContent = msg;
        };

        try {
            const isLocal = location.hostname === 'localhost';
            const DTM = await import(isLocal
                ? 'http://localhost:40298/dist/index.mjs'
                : './index.mjs');
            // コード進行も encodeMml で詰めてある。展開後の上限・壊れたデータの "" はライブラリ側が持つ
            const chords = await DTM.decodeMml(location.hash.slice(1));
            if (!chords) {
                fail('再生するコード進行データがURLにありません（#... が空です）。');
            } else {
                const { createDtmStudio } = DTM;

                const studio = await createDtmStudio();
                bootEl.style.display = 'none';
                const player = studio.mountChordPlayer(playerEl, chords, { volume: 50 });

                const volumeRow = document.getElementById('volume-row');
                const volumeSlider = document.getElementById('volume-slider');
                const volumeLabel = document.getElementById('volume-label');
                volumeRow.style.display = 'flex';
                volumeSlider.addEventListener('input', () => {
                    const vol = parseInt(volumeSlider.value, 10);
                    volumeLabel.textContent = `${vol}%`;
                    player.setVolume(vol);
                });
            }
        } catch (e) {
            fail('プレイヤーの初期化に失敗しました: ' + (e?.message ?? e));
            console.error(e);
        }
    </script>
</body>

</html>
